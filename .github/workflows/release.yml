name: release

# 一次发布 = 推一个 tag。CI 依次做：校验 tag 与 version 一致 -> 跑测试 -> 发 npm -> 建 GitHub Release。
#
# npm 侧用 **trusted publishing（OIDC）**：不需要任何长期 token，
# 由 npm 用短时签名凭据认证（见 docs/installation.md 的发布流程）。
#
# 一次性准备（只需做一次）：
#   1. 包必须已存在：首次发布要在本地交互式 `npm publish`（npm 要求 2FA 挑战）。
#   2. npmjs.com -> 该包 -> Settings -> Trusted Publisher ->
#      GitHub Actions: organization/user = Imzl-zl, repository = dsh-toolbox-ui,
#      workflow filename = release.yml（可另填 environment）。
#      ⚠️ 这一项是 **GitHub 仓库名**，必须与仓库当前 slug 一致；改名后不同步改它，publish 会被拒。
#   3. 之后每次发布只需要：改 version、提交、`git push origin main`、`git push origin vX.Y.Z`。
#
# 想先确认流水线本身健康（不改任何版本、不发布），手动跑一次：
#   gh workflow run release.yml --ref main -f dry_run=true
# 它会跑同样的安装 + 测试，只在最后跳过发布与建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑安装与测试，不发布 npm、不建 Release'
        type: boolean
        default: true

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing（OIDC）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本漂移是发布里最常见的错误：tag 与 package.json 不一致就直接失败，
      # 不要发出一个「tag 说 1.2.2、包说 1.2.1」的版本。
      # 手动试跑（workflow_dispatch）没有 tag，跳过这项比较。
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} — bump the version, commit, then re-tag"
            exit 1
          fi
          echo "releasing ${pkg}"

      - name: Report the version under test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          echo "dry run on ${GITHUB_REF_NAME}: ${pkg}"

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing 需要 npm CLI >= 11.5.1（OIDC 支持）
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@^11

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      # 与本地 `npm test` 同一条门槛（含真机集成用例）。
      # 若某次发布希望跳过，删掉这一步即可——发布的是已提交的预构建 lib/，没有构建步骤。
      - name: Test
        run: npm test

      # ⚠️ 已经发过的版本要**跳过**，而不是报错：
      # 一个新包名的**首个版本**必须先由维护者本地交互式发布（npm 要求包先存在，才能配置
      # trusted publisher —— 见 docs/installation.md 的一次性准备），之后为同一版本推 tag
      # 时这一步必然撞上「版本已存在」。那不是错误：CI 该做的是校验版本、跑测试、建 Release。
      # 所以先问一句 npm，已经在上面就跳过并打印一行（谁都能从日志里看出发生了什么）。
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} 已经在 npm 上（首个版本由维护者本地发布）——跳过 publish，继续建 Release"
          else
            npm publish
          fi

      # Release notes：有手写稿就用它，否则用提交生成。手写稿放在 .github/release-notes/，
      # 不放 docs/ —— docs 会随包发布到 npm。
      #
      # ⚠️ 标题里的包名**从 package.json 取，不写死**：这个仓库里先后有两条产品线
      # （旧包 dsh-mcp-manager-ui 已冻结在 1.5.5，现在是 dsh-toolbox-ui），写死会让其中一条
      # 的 Release 标题挂上另一条的包名（v1.6.0 的稿子当初就是这么错的）。
      #
      # 为什么**不再带** `--prerelease`（v1.8.2 起）：两条线共用一个 `releases/latest`，而老线面板
      # 的「升级」按钮读的就是它、下发的却是旧包名的新版本——所以 1.6.0–1.8.1 一律标 pre-release，
      # 让 latest 停在旧线的 v1.5.5 上（那是旧线唯一的升级/迁移入口）。
      #
      # 现在翻过来的依据（2026-10-20 复核）：
      #   - 旧线对我们已经是硬不兼容：DSH `0.2.1-rc.1/rc.2`（10-17 发布）要求 peer 落在
      #     `>=0.2.0-rc.1 <0.3.0`，而老包钉的是 `>=0.1.5-rc.1 <0.2.0`。用户升级宿主后旧包直接
      #     加载不了，只能按 CLI 迁移——latest 留给他们已经没有下文。
      #   - 老包的 npm 下载已回落成发版尾流：10-12..10-18 合计 108 次，其中 62 次在 1.5.5 发版
      #     次日，其余几天 0–19；同期本包 958 次。
      #   - 残留风险只剩一条：仍停在 DSH 0.1.x、且旧包 <1.5.5 的用户点「升级」会看到 pnpm 的
      #     `ERR_PNPM_NO_MATCHING_VERSION`（不会卸载任何东西）。补偿是两处常驻说明——1.5.5 的
      #     迁移横幅不依赖更新查询，v1.5.5 的 Release 里也写着两条 CLI 迁移命令。
      #
      # 本线自己的更新提示**必须**问自己包在 npm 上的 latest（lib/index.js 的 updateLatestUrl），
      # 不读这个 feed：它曾经读 feed，被 pre-release 规则永远挡在旧线版本上——提示恒为「已是最新」，
      # v1.6.2 发出去 1.6.1 的用户什么也看不到（有专门用例钉住数据源）。别把这条改回去。
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "${name} ${GITHUB_REF_NAME}" \
              --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "${name} ${GITHUB_REF_NAME}" \
              --generate-notes --verify-tag
          fi
