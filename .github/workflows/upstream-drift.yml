name: upstream-drift

# Runtime contracts are separate from the development pin assertions in ci.yml.
# Every npm version gets a fresh job; source HEAD is a separate commit-identified candidate.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: targets
        name: Freeze and deduplicate npm targets
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const registry = 'https://registry.npmjs.org/'
          const response = await fetch(`${registry}-/package/@deepseek-ai%2Fdsh/dist-tags`, { signal: AbortSignal.timeout(60000) })
          if (!response.ok) throw new Error(`dist-tags: HTTP ${response.status}`)
          const tags = await response.json()
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const baseline = manifest.devDependencies['@deepseek-ai/dsh-agent']
          const targets = new Map()
          for (const [label, version] of [['baseline', baseline], ['npm-rc', '0.2.2-rc.1'], ...['latest', 'next', 'alpha'].map(tag => [tag, tags[tag]])]) {
            if (version === undefined) {
              console.log(`::notice::npm channel ${label} is absent`)
              continue
            }
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error(`Expected an exact version for ${label}: ${version}`)
            const target = targets.get(version) ?? { version, labels: [], modern: /^0\.2\.[01](?:-|$)/.test(version) ? '0' : '1' }
            target.labels.push(label)
            targets.set(version, target)
          }
          const matrix = { include: [...targets.values()].map(target => ({ ...target, label: target.labels.join('+') })) }
          console.log(JSON.stringify(matrix, null, 2))
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`)
          NODE

  npm:
    needs: targets
    name: npm ${{ matrix.version }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      HOST_VERSION: ${{ matrix.version }}
      DSH_EXPECT_STEP_TOOLSET: ${{ matrix.modern }}
    steps:
      - uses: actions/checkout@v7
      - name: Isolate host data roots
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
          echo "DSH_AGENTS_HOME=$RUNNER_TEMP/dsh-agents" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve the complete matching host set
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const version = process.env.HOST_VERSION
          const metadata = async (name, optional = false) => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, { signal: AbortSignal.timeout(60000) })
            if (optional && response.status === 404) return undefined
            if (!response.ok) throw new Error(`${name}@${version}: HTTP ${response.status}`)
            return response.json()
          }
          const host = await metadata('@deepseek-ai/dsh')
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const names = new Set([
            ...Object.keys(manifest.devDependencies).filter(name => name.startsWith('@deepseek-ai/dsh-')),
            ...Object.keys(manifest.peerDependencies).filter(name => name.startsWith('@deepseek-ai/dsh-')),
            '@deepseek-ai/dsh-system-prompt',
          ])
          // These packages do not exist on the legacy baseline. Modern fixtures must import
          // both executors successfully; a missing modern artifact must fail, not skip.
          for (const name of ['@deepseek-ai/dsh-tool-executor-native', '@deepseek-ai/dsh-tool-executor-ptc']) {
            if (await metadata(name, true)) names.add(name)
          }
          const specs = [...names].map(name => `${name}@${version}`)
          for (const name of ['@deepseek-ai/cordis', '@deepseek-ai/cordis-plugin-loader', '@deepseek-ai/cordis-plugin-include']) {
            const range = host.dependencies?.[name]
            if (typeof range !== 'string' || range.length === 0) throw new Error(`Missing host dependency: ${name}`)
            specs.push(`${name}@${range}`)
          }
          writeFileSync('host-package-specs.json', JSON.stringify({ version, integrity: host.dist.integrity, names: [...names], specs }, null, 2))
          console.log(readFileSync('host-package-specs.json', 'utf8'))
          NODE
      - name: Install DSH and Cordis / Loader / Include together
        run: |
          mapfile -t packages < <(node -p "JSON.parse(require('fs').readFileSync('host-package-specs.json', 'utf8')).specs.join('\n')")
          # Only this disposable job changes dependency pins. Runtime drift testing must
          # reach the target implementation even when the plugin's declared peer window rejects it.
          pnpm add -D --save-exact --config.minimumReleaseAge=0 --config.strictPeerDependencies=false "${packages[@]}"
      - name: Record and verify resolved host identities
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const expected = JSON.parse(readFileSync('host-package-specs.json', 'utf8'))
          for (const name of [...expected.names, '@deepseek-ai/cordis', '@deepseek-ai/cordis-plugin-loader', '@deepseek-ai/cordis-plugin-include']) {
            const path = require.resolve(`${name}/package.json`)
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            console.log(name, manifest.version, path)
            if (name.startsWith('@deepseek-ai/dsh-')) assert.equal(manifest.version, expected.version, name)
          }
          const toolsRequire = createRequire(require.resolve('@deepseek-ai/dsh-tools'))
          assert.equal(toolsRequire.resolve('@deepseek-ai/cordis'), require.resolve('@deepseek-ai/cordis'), 'tools must use the same Cordis instance')
          NODE
      - name: Run runtime contracts with a 60-second test timeout
        run: |
          mkdir -p "$DSH_HOME" "$DSH_AGENTS_HOME"
          files=()
          for file in test/*.test.mjs; do
            [[ "$file" == test/package-contract.test.mjs ]] || files+=("$file")
          done
          node --test --test-timeout=60000 "${files[@]}"

  source-head:
    name: source HEAD candidate (not an npm release)
    runs-on: ubuntu-latest
    env:
      DSH_EXPECT_STEP_TOOLSET: '1'
    steps:
      - name: Isolate source candidate data roots
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/source-dsh-home" >> "$GITHUB_ENV"
          echo "DSH_AGENTS_HOME=$RUNNER_TEMP/source-dsh-agents" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: upstream
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Identify and build the source candidate
        working-directory: upstream
        run: |
          echo "source candidate commit: $(git rev-parse HEAD)"
          pnpm install --frozen-lockfile
          pnpm run build:artifacts --profile official
      - name: Stage plugin tests within the built source dependency tree
        run: |
          fixture="$GITHUB_WORKSPACE/upstream/.plugin-contracts/toolbox"
          mkdir -p "$fixture" "$DSH_HOME" "$DSH_AGENTS_HOME"
          tar --exclude=.git --exclude=node_modules -C plugin -cf - . | tar -C "$fixture" -xf -
          cp "$fixture/package.json" "$RUNNER_TEMP/plugin-package.json"
          # Install only the plugin's own runtime dependencies. All host imports must
          # resolve to the built source workspace, including unreleased HEAD changes.
          node --input-type=module - "$fixture/package.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = process.argv[2]
          const manifest = JSON.parse(readFileSync(path, 'utf8'))
          writeFileSync(path, JSON.stringify({ name: manifest.name, version: manifest.version, private: true, type: 'module', dependencies: manifest.dependencies }))
          NODE
          npm install --prefix "$fixture" --workspaces=false --ignore-scripts --package-lock=false --legacy-peer-deps
          cp "$RUNNER_TEMP/plugin-package.json" "$fixture/package.json"
          node --input-type=module - "$fixture" <<'NODE'
          import { globSync, mkdirSync, readFileSync, symlinkSync } from 'node:fs'
          import { dirname, resolve } from 'node:path'
          const fixture = process.argv[2]
          const source = resolve('upstream')
          const root = JSON.parse(readFileSync(resolve(source, 'package.json'), 'utf8'))
          const plugin = JSON.parse(readFileSync(resolve(fixture, 'package.json'), 'utf8'))
          const required = new Set([
            ...Object.keys(plugin.devDependencies).filter(name => name.startsWith('@deepseek-ai/')),
            ...Object.keys(plugin.peerDependencies).filter(name => name.startsWith('@deepseek-ai/')),
            '@deepseek-ai/dsh-system-prompt', '@deepseek-ai/dsh-tool-executor-native', '@deepseek-ai/dsh-tool-executor-ptc',
          ])
          for (const pattern of root.workspaces) {
            for (const path of globSync(`${pattern}/package.json`, { cwd: source })) {
              const absolute = resolve(source, path)
              const manifest = JSON.parse(readFileSync(absolute, 'utf8'))
              if (!required.delete(manifest.name)) continue
              const link = resolve(fixture, 'node_modules', manifest.name)
              mkdirSync(dirname(link), { recursive: true })
              symlinkSync(dirname(absolute), link, 'dir')
            }
          }
          if (required.size) throw new Error(`Missing source packages: ${[...required].join(', ')}`)
          NODE
      - name: Verify source identities and run candidate contracts
        working-directory: upstream/.plugin-contracts/toolbox
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, realpathSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { resolve, sep } from 'node:path'
          const require = createRequire(import.meta.url)
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const source = realpathSync(resolve('../..')) + sep
          const names = new Set([
            ...Object.keys(manifest.devDependencies).filter(name => name.startsWith('@deepseek-ai/')),
            '@deepseek-ai/dsh-system-prompt', '@deepseek-ai/dsh-tool-executor-native', '@deepseek-ai/dsh-tool-executor-ptc',
          ])
          for (const name of names) {
            const path = realpathSync(require.resolve(`${name}/package.json`))
            assert.ok(path.startsWith(source) && !path.includes(`${sep}node_modules${sep}.pnpm${sep}`), `${name} must come from source HEAD: ${path}`)
            console.log(name, JSON.parse(readFileSync(path, 'utf8')).version, path)
          }
          const toolsRequire = createRequire(require.resolve('@deepseek-ai/dsh-tools'))
          assert.equal(toolsRequire.resolve('@deepseek-ai/cordis'), require.resolve('@deepseek-ai/cordis'), 'source tools must use the same Cordis instance')
          NODE
          files=()
          for file in test/*.test.mjs; do
            [[ "$file" == test/package-contract.test.mjs ]] || files+=("$file")
          done
          node --test --test-timeout=60000 "${files[@]}"
